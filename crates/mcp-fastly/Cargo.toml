[package]
name = "mcp-fastly"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Fastly Compute bindings for mcp-core: request adapter, JWT/JWKS verifier, edge caching, KV-backed task store."

[dependencies]
mcp-core = { path = "../mcp-core" }
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
# ES256 JWT verification (WASM-compatible RustCrypto; avoids ring/native TLS).
p256 = { version = "0.13", features = ["ecdsa"] }

# The fastly SDK provides host calls that only link under wasm32-wasip1. All
# code that touches it is gated behind #[cfg(target_arch = "wasm32")], so the
# pure verification/config logic stays host-testable via `cargo test`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
fastly = "0.13"
